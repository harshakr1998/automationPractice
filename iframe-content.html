<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iframe Content</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f4f4f4;
        padding: 20px;
      }

      h3 {
        color: #007bff;
      }

      #iframe-button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 5px;
        transition: background 0.3s;
      }

      #iframe-button:hover {
        background-color: #0056b3;
      }

      #message {
        margin-top: 15px;
        font-size: 14px;
        color: #333;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h3>Iframe Content</h3>
    <button id="iframe-button">Click Me</button>
    <p id="message"></p>

    <script>
      document
        .getElementById("iframe-button")
        .addEventListener("click", function () {
          document.getElementById("message").innerText =
            "Button inside iframe clicked!";
        });
    </script>
  </body>
</html>
